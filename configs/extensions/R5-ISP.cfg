! Apply these additions to R5 after base configuration.
! Verify GigabitEthernet2/0 is the R13-facing port.
configure terminal
interface GigabitEthernet2/0
 description TO-R13-SIMULATED-ISP
 ip address 203.0.113.1 255.255.255.252
 no shutdown
exit
! Static default: send otherwise unknown traffic to R13.
ip route 0.0.0.0 0.0.0.0 203.0.113.2
router ospf 1
! Originate default only when installed in the R5 routing table.
 default-information originate
exit
end
write memory
