! R13 is outside OSPF and simulates an ISP. Documentation-only IPs.
configure terminal
hostname R13
no ip domain-lookup
interface GigabitEthernet0/0
 description TO-R5-OSPF-EDGE
 ip address 203.0.113.2 255.255.255.252
 no shutdown
exit
interface Loopback0
 description SIMULATED-INTERNET-DESTINATION
 ip address 198.51.100.1 255.255.255.0
 no shutdown
exit
! Return routes for illustrative test sources in OSPF.
ip route 10.0.0.0 255.0.0.0 203.0.113.1
ip route 1.1.1.1 255.255.255.255 203.0.113.1
end
write memory
