! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R3
no ip domain-lookup
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R6-AREA5
 ip address 10.0.20.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R2-AREA5
 ip address 10.0.30.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description TO-R4-AREA0
 ip address 10.0.50.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 network 10.0.20.0 0.0.0.3 area 5
 network 10.0.30.0 0.0.0.3 area 5
 network 10.0.50.0 0.0.0.3 area 0
 network 3.3.3.3 0.0.0.0 area 0
 passive-interface Loopback0
 area 5 virtual-link 2.2.2.2
!
end
write memory
