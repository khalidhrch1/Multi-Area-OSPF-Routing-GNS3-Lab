! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R7
no ip domain-lookup
!
interface Loopback0
 ip address 7.7.7.7 255.255.255.255
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R4-AREA0
 ip address 10.0.70.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R8-AREA0
 ip address 10.0.80.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 7.7.7.7
 network 10.0.70.0 0.0.0.3 area 0
 network 10.0.80.0 0.0.0.3 area 0
 network 7.7.7.7 0.0.0.0 area 0
 passive-interface Loopback0
!
end
write memory
