! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R5
no ip domain-lookup
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R4-AREA0
 ip address 10.0.60.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R8-AREA0
 ip address 10.0.90.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 5.5.5.5
 network 10.0.60.0 0.0.0.3 area 0
 network 10.0.90.0 0.0.0.3 area 0
 network 5.5.5.5 0.0.0.0 area 0
 passive-interface Loopback0
!
end
write memory
