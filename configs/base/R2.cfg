! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R2
no ip domain-lookup
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R3-AREA5
 ip address 10.0.30.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R1-AREA7
 ip address 10.0.40.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.0.30.0 0.0.0.3 area 5
 network 10.0.40.0 0.0.0.3 area 7
 network 2.2.2.2 0.0.0.0 area 7
 passive-interface Loopback0
 area 5 virtual-link 3.3.3.3
!
end
write memory
