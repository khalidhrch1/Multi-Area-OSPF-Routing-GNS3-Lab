! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R6
no ip domain-lookup
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R1-AREA7
 ip address 10.0.10.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R3-AREA5
 ip address 10.0.20.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 6.6.6.6
 network 10.0.10.0 0.0.0.3 area 7
 network 10.0.20.0 0.0.0.3 area 5
 network 6.6.6.6 0.0.0.0 area 7
 passive-interface Loopback0
!
end
write memory
