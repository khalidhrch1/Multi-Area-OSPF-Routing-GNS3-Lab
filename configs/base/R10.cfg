! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R10
no ip domain-lookup
!
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R9-AREA6
 ip address 10.0.140.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R12-AREA0
 ip address 10.0.130.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.10.10.10
 network 10.0.140.0 0.0.0.3 area 6
 network 10.0.130.0 0.0.0.3 area 0
 network 10.10.10.10 0.0.0.0 area 0
 passive-interface Loopback0
!
end
write memory
