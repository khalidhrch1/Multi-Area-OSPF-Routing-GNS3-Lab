! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R8
no ip domain-lookup
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R5-AREA0
 ip address 10.0.90.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R7-AREA0
 ip address 10.0.80.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description TO-R9-AREA6
 ip address 10.0.100.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 8.8.8.8
 network 10.0.90.0 0.0.0.3 area 0
 network 10.0.80.0 0.0.0.3 area 0
 network 10.0.100.0 0.0.0.3 area 6
 network 8.8.8.8 0.0.0.0 area 0
 passive-interface Loopback0
 area 6 virtual-link 11.11.11.11
!
end
write memory
