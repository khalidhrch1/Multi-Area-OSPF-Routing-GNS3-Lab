! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R1
no ip domain-lookup
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R6-AREA7
 ip address 10.0.10.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R2-AREA7
 ip address 10.0.40.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.10.0 0.0.0.3 area 7
 network 10.0.40.0 0.0.0.3 area 7
 network 1.1.1.1 0.0.0.0 area 7
 passive-interface Loopback0
!
end
write memory
