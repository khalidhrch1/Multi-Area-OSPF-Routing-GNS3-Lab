! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R9
no ip domain-lookup
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R10-AREA6
 ip address 10.0.140.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R11-AREA6
 ip address 10.0.110.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description TO-R8-AREA6
 ip address 10.0.100.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 9.9.9.9
 network 10.0.140.0 0.0.0.3 area 6
 network 10.0.110.0 0.0.0.3 area 6
 network 10.0.100.0 0.0.0.3 area 6
 network 9.9.9.9 0.0.0.0 area 6
 passive-interface Loopback0
!
end
write memory
