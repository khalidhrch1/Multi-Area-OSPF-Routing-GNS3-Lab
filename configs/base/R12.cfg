! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R12
no ip domain-lookup
!
interface Loopback0
 ip address 12.12.12.12 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R10-AREA0
 ip address 10.0.130.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R11-AREA0
 ip address 10.0.120.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 12.12.12.12
 network 10.0.130.0 0.0.0.3 area 0
 network 10.0.120.0 0.0.0.3 area 0
 network 12.12.12.12 0.0.0.0 area 0
 passive-interface Loopback0
!
end
write memory
