! Educational reference; adapt interfaces/IPs to your GNS3 appliance.
enable
configure terminal
hostname R4
no ip domain-lookup
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO-R7-AREA0
 ip address 10.0.70.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description TO-R5-AREA0
 ip address 10.0.60.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description TO-R3-AREA0
 ip address 10.0.50.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 network 10.0.70.0 0.0.0.3 area 0
 network 10.0.60.0 0.0.0.3 area 0
 network 10.0.50.0 0.0.0.3 area 0
 network 4.4.4.4 0.0.0.0 area 0
 passive-interface Loopback0
!
end
write memory
